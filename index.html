<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş Uygulaması</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Telefon Çerçevesi */
        .mobile-app {
            width: 390px;
            height: 844px;
            background-color: #4a3018;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Üst Menü (Header) */
        .header {
            background-color: #fdb913;
            margin: 24px 20px 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 16px;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon svg {
            width: 44px;
            height: 44px;
            stroke: #4a3018;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-bar {
            flex: 1;
            background-color: #7b4c1a;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            justify-content: space-between;
        }

        .search-bar input {
            background: none;
            border: none;
            color: #fdb913;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            outline: none;
        }

        .search-bar input::placeholder {
            color: #fdb913;
            opacity: 0.9;
        }

        .search-bar svg {
            width: 24px;
            height: 24px;
            stroke: #fdb913;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* Ana İçerik (Grid Izgarası) */
        .grid-container {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 0 20px;
            overflow-y: auto;
        }

        .grid-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Fiyat Etiketleri */
        .price {
            position: absolute;
            color: #ffffff;
            font-size: 44px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0px 2px 8px rgba(0,0,0,0.6);
        }

        .currency {
            font-size: 20px;
            position: relative;
            top: -16px;
            margin-right: 2px;
            letter-spacing: 0;
        }

        /* Fiyat Konumlandırmaları */
        .pos-bl { bottom: 8px; left: 12px; }
        .pos-br { bottom: 8px; right: 12px; }
        .pos-tl { top: 8px; left: 12px; }

        /* Kart Yükseklikleri (Hizalamayı Korumak İçin) */
        .h-coffee { height: 140px; }
        .h-drink { height: 260px; }
        .h-pizza { height: 160px; }
        
        .h-burger { height: 140px; }
        .h-sandwich { height: 210px; }
        .h-chicken { height: 210px; }

        /* Alt Menü (Footer) */
        .footer {
            background-color: #fdb913;
            margin: 16px 20px 24px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }

        .footer svg {
            width: 36px;
            height: 36px;
            stroke: #4a3018;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

<div class="mobile-app">
    <!-- Üst Bar -->
    <div class="header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
    </div>

    <!-- Menü Kartları -->
    <div class="grid-container">
        <!-- Sol Kolon -->
        <div class="grid-col">
            <div class="card h-coffee">
                <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?q=80&w=600&auto=format&fit=crop" alt="Coffee">
                <span class="price pos-bl"><span class="currency">$</span>2,5</span>
            </div>
            <div class="card h-drink">
                <img src="https://images.unsplash.com/photo-1572490122747-3968b75cc699?q=80&w=600&auto=format&fit=crop" alt="Chocolate Drink">
                <span class="price pos-br"><span class="currency">$</span>3</span>
            </div>
            <div class="card h-pizza">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=600&auto=format&fit=crop" alt="Pizza">
                <span class="price pos-tl"><span class="currency">$</span>12</span>
            </div>
        </div>

        <!-- Sağ Kolon -->
        <div class="grid-col">
            <div class="card h-burger">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600&auto=format&fit=crop" alt="Burger">
                <span class="price pos-br"><span class="currency">$</span>5</span>
            </div>
            <div class="card h-sandwich">
                <img src="https://images.unsplash.com/photo-1619096252214-ef06c45683e3?q=80&w=600&auto=format&fit=crop" alt="Sandwich">
                <span class="price pos-tl" style="opacity: 0.95;"><span class="currency">$</span>5</span>
            </div>
            <div class="card h-chicken">
                <img src="https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?q=80&w=600&auto=format&fit=crop" alt="Chicken">
                <span class="price pos-bl"><span class="currency">$</span>25</span>
            </div>
        </div>
    </div>

    <!-- Alt Navigasyon -->
    <div class="footer">
        <svg viewBox="0 0 24 24">
            <path d="M3 9.5L12 3l9 6.5"></path>
            <path d="M5 10v11a1 1 0 0 0 1 1h4v-7h4v7h4a1 1 0 0 0 1-1V10"></path>
        </svg>
        <svg viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <svg viewBox="0 0 24 24">
            <rect x="3" y="8" width="18" height="4" rx="1"></rect>
            <path d="M12 8v13"></path>
            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path>
            <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path>
        </svg>
        <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </div>
</div>

</body>
</html>
